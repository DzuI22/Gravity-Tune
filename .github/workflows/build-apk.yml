name: Build Android APK Release v5.1.0

on:
  push:
    branches:
      - v5.1.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Release GravityTune APK v5.1.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK Local Properties & Licenses
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: ./gradlew assembleDebug --no-daemon -x lint

      - name: Copy APK to output
        run: |
          mkdir -p release-files
          APK_PATH=$(find android -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -type f | head -n 1)
          fi
          echo "Using APK found at: $APK_PATH"
          cp "$APK_PATH" release-files/GravityTune-v5.1.0.apk
          ls -lh release-files/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GravityTune-Android-APK-v5.1.0
          path: release-files/GravityTune-v5.1.0.apk
          retention-days: 30

      - name: Publish Official Release v5.1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.1.0
          name: "GravityTune v5.1.0 (Major Release: Glass UI, Podcasts & Community)"
          body: |
            ## 🎵 GravityTune v5.1.0 - Official Android APK (Major Release)

            Selamat datang di **GravityTune v5.1.0**! Pembaruan akbar yang membawa antarmuka kaca mutakhir, perpustakaan podcast lengkap, serta pemutaran latar belakang yang kebal jeda.

            ### ✨ Fitur Unggulan di v5.1.0:
            - **💎 Liquid Glassmorphism UI:** Desain antarmuka kaca buram (*frosted glass*) dengan animasi transisi pegas super halus.
            - **🔊 Kebal Background Play & Lock Screen:** Audio tetap bersuara saat layar HP mati dengan kontrol notifikasi responsif.
            - **🎙️ Dedicated Podcast Library:** Pengelolaan podcast YouTube Music lengkap dengan resume durasi menit terakhir.
            - **🏠 Featured & Community Playlists:** Eksplorasi playlist buatan komunitas YouTube Music di halaman Home.
            - **🎨 Immersive Player & Ambient Backdrop:** Pencahayaan latar dinamis menyesuaikan nuansa warna cover lagu.
            - **⚡ YouTube Engine Hardening:** Pemulihan otomatis saat terjadi kendala stream.

            ### 📲 Cara Pemasangan di HP Android:
            1. Unduh berkas **`GravityTune-v5.1.0.apk`** di bawah ini.
            2. Izinkan instalasi dari sumber tidak dikenal jika diminta oleh Android.
            3. Pasang dan nikmati pengalaman audio tingkat audiophile!

            > Build Hash: ${{ github.sha }}
          files: release-files/GravityTune-v5.1.0.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
