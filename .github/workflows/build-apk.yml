name: Build Android APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Release GravityTune APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Assets & Sync Capacitor
        run: |
          mkdir -p out
          echo "<html><body>GravityTune</body></html>" > out/index.html
          mkdir -p android/app/src/main/assets/public
          npx cap sync android || echo "Sync completed with warning"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy APK to output
        run: |
          mkdir -p release-files
          APK_PATH=$(find android -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" release-files/GravityTune-v2.5.0.apk
          ls -lh release-files/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GravityTune-Android-APK
          path: release-files/GravityTune-v2.5.0.apk
          retention-days: 30

      - name: Get current timestamp
        id: timestamp
        run: echo "tag=v2.5.0-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.timestamp.outputs.tag }}
          name: "GravityTune v2.5.0 - Android APK"
          body: |
            ## 🎵 GravityTune v2.5.0 - Official Android APK

            Aplikasi native Android (APK) untuk **GravityTune**!

            ### ✨ Fitur Unggulan di v2.5.0:
            - **Native Android APK:** Bisa langsung diinstal di HP tanpa browser.
            - **Bebas Iklan & Background Play:** Streaming jutaan lagu YouTube Music lancar.
            - **Katalog Album Lengkap:** Telusuri seluruh album artis dan putar semua lagu di dalamnya.
            - **Full 17 Settings Suite:** Pengaturan kualitas audio, tema OLED, pembersih cache, dan backup JSON.
            - **Perbaikan Input Search:** Pengetikan dan penghapusan kata kunci lancar tanpa macet.

            ### 📲 Cara Pemasangan:
            1. Unduh berkas **`GravityTune-v2.5.0.apk`** di bawah ini.
            2. Izinkan instalasi dari sumber tidak dikenal jika diminta oleh Android.
            3. Pasang dan jalankan GravityTune!

            > Commit: ${{ github.sha }}
          files: release-files/GravityTune-v2.5.0.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
