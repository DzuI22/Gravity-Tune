name: Build Android APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Release GravityTune APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK (no signing needed)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK file
        run: |
          echo "=== Searching for APK files ==="
          find android -name "*.apk" -type f
          echo "=============================="

      - name: Copy APK to output
        run: |
          mkdir -p release-files
          APK_PATH=$(find android -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" release-files/GravityTune-v2.5.0.apk
          ls -lh release-files/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GravityTune-Android-APK
          path: release-files/GravityTune-v2.5.0.apk
          retention-days: 30

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v2.5.0-${{ steps.date.outputs.date }}"
          name: "GravityTune v2.5.0 - Android APK"
          body: |
            ## 🎵 GravityTune v2.5.0 - Official Android APK

            Aplikasi murni Android (APK) untuk **GravityTune**!

            ### ✨ Fitur Unggulan di v2.5.0:
            - **Native Android APK:** Bisa langsung diinstal di HP tanpa perantara browser.
            - **Bebas Iklan & Background Play:** Streaming jutaan lagu YouTube Music lancar.
            - **Katalog Album Lengkap:** Telusuri seluruh album artis dan putar semua lagu di dalamnya.
            - **Full 17 Settings Suite:** Pengaturan kualitas audio, tema OLED, pembersih cache, dan backup JSON.
            - **Perbaikan Input Search:** Pengetikan dan penghapusan kata kunci lancar.

            ### 📲 Cara Pemasangan:
            1. Unduh berkas **`GravityTune-v2.5.0.apk`** di bawah ini.
            2. Izinkan "Install dari sumber tidak dikenal" di pengaturan Android.
            3. Buka berkas APK dan pilih **Install**.

            > Build: ${{ github.sha }} | ${{ steps.date.outputs.date }}
          files: release-files/GravityTune-v2.5.0.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
