name: Build Android APK Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Release GravityTune APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Native Android Project & Build APK
        run: |
          mkdir -p android-project
          cd android-project

          # Install Bubblewrap CLI
          npm install -g @bubblewrap/cli

          # Create twa-manifest.json directly
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "com.gravitytune.app",
            "host": "gravity-tune-three.vercel.app",
            "name": "GravityTune",
            "launcherName": "GravityTune",
            "display": "standalone",
            "themeColor": "#0e0d0c",
            "themeColorDark": "#0e0d0c",
            "navigationColor": "#131211",
            "navigationColorDark": "#131211",
            "navigationDividerColor": "#00000000",
            "navigationDividerColorDark": "#00000000",
            "backgroundColor": "#0e0d0c",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://raw.githubusercontent.com/DzuI22/Gravity-Tune/main/public/logo.png",
            "maskableIconUrl": "https://raw.githubusercontent.com/DzuI22/Gravity-Tune/main/public/logo.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "gravitytune"
            },
            "appVersionName": "2.5.0",
            "appVersionCode": 250,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://gravity-tune-three.vercel.app/manifest.json",
            "fallbackType": "customtabs",
            "features": {
              "locationDelegation": {
                "enabled": false
              },
              "playBilling": {
                "enabled": false
              }
            },
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false
          }
          EOF

          # Generate release keystore
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias gravitytune \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "gravitytune123" \
            -keypass "gravitytune123" \
            -dname "CN=GravityTune, OU=App, O=GravityTune, L=Jakarta, C=ID"

          # Download app logo
          curl -sL "https://raw.githubusercontent.com/DzuI22/Gravity-Tune/main/public/logo.png" -o icon.png

          # Point Bubblewrap to preinstalled Android SDK & JDK on ubuntu-latest
          mkdir -p ~/.bubblewrap
          cat << EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF

          # Build APK
          bubblewrap build --skipPwaValidation || true

      - name: Locate and Organize Output APK
        run: |
          mkdir -p output-apk
          # Search for any built apk files
          find android-project -name "*.apk" -exec cp -v {} output-apk/GravityTune-v2.5.0.apk \;
          ls -la output-apk/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GravityTune-Android-APK
          path: output-apk/*.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.5.0
          name: "GravityTune v2.5.0 (Official Android APK Release)"
          body: |
            ## 🎵 GravityTune v2.5.0 - Official Android APK
            
            Aplikasi murni Android (APK) untuk **GravityTune**!
            
            ### ✨ Fitur Unggulan di v2.5.0:
            - **Native Android APK:** Bisa langsung diinstal di HP tanpa perantara browser.
            - **Bebas Iklan & Background Play:** Streaming jutaan lagu YouTube Music lancar.
            - **Katalog Album Lengkap:** Telusuri seluruh album artis dan putar semua lagu di dalamnya.
            - **Full 17 Settings Suite:** Pengaturan kualitas audio, tema OLED, pembersih cache, dan backup JSON.
            - **Perbaikan Input Search:** Pengetikan dan penghapusan kata kunci lancar.
            
            ### 📲 Cara Pemasangan:
            1. Unduh file **`GravityTune-v2.5.0.apk`** di bawah ini.
            2. Buka file di HP Android Anda dan klik **Install**.
          files: output-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
