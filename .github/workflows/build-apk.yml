name: Build Android APK Release

on:
  push:
    branches:
      - main
      - v5.1.0
      - v7.5.3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Release GravityTune APK v7.5.3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK Local Properties & Licenses
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: ./gradlew assembleDebug --no-daemon -x lint

      - name: Copy APK to output
        run: |
          mkdir -p release-files
          APK_PATH=$(find android -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -type f | head -n 1)
          fi
          echo "Using APK found at: $APK_PATH"
          cp "$APK_PATH" release-files/GravityTune-v7.5.3.apk
          ls -lh release-files/

      - name: Update README.md automatically
        run: |
          node scripts/update-readme.js
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain README.md)" ]; then
            git add README.md
            git commit -m "docs: auto-update README.md for GravityTune v7.5.3 release"
            git push origin HEAD:${{ github.ref_name }} || true
          fi

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GravityTune-Android-APK-v7.5.3
          path: release-files/GravityTune-v7.5.3.apk
          retention-days: 30

      - name: Publish Official Release v7.5.3
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v7.5.3
          name: "GravityTune v7.5.3 (Major Release: Standalone App, Warm Amber OLED & Apple Music Lyrics)"
          body: |
            ## 🎵 GravityTune v7.5.3 - Official Standalone Android APK (Major Release)

            Selamat datang di **GravityTune v7.5.3**! Pembaruan akbar yang membawa antarmuka baru Warm Amber OLED, Apple Music-style dynamic synced lyrics, sleep lock screen mode, canvas video backdrop, dan format **APK Mandiri (Standalone)** dengan ID paket `com.gravitytune.v7` sehingga dapat dipasang berdampingan dengan versi terdahulu (v2.5.0 dan v5.1.0) tanpa saling menimpa!

            ### ✨ Fitur Unggulan di v7.5.3:
            - **💎 Standalone App ID (`com.gravitytune.v7`):** Bisa dipasang bersamaan dengan v2.5.0 dan v5.1.0 di satu smartphone.
            - **🌙 Warm Amber & Pure Black OLED:** Desain ultra-kontras hemat daya dengan aksen emas hangat dan tombol floating pills.
            - **🎤 Apple Music Synced Lyrics:** Animasi line bounce karaoke, blur baris dinamis, fluid transition, dan slider volume mandiri di tampilan lirik.
            - **🔒 In-App Sleep / Lock Screen Mode:** Layar kunci dalam aplikasi lengkap dengan jam digital besar, indikator baterai riil, dan gestur *Slide to Unlock*.
            - **🎬 Canvas Motion Backdrop:** Looping animasi latar album dengan dukungan multi-provider (Spotify, Apple Music, TIDAL, BetterLyrics) serta opsi Wi-Fi only.
            - **⚙️ Full Settings Suite:** Appearance (144Hz high refresh rate), Audio Quality, AI Integration (Google Gemini & OpenAI), dan Cloud Sync.

            ### 📱 Cara Pemasangan di HP Android:
            1. Unduh berkas **`GravityTune-v7.5.3.apk`** di bawah ini.
            2. Izinkan instalasi dari sumber tidak dikenal jika diminta oleh Android.
            3. Pasang dan nikmati pengalaman audio tingkat audiophile!

            > Build Hash: ${{ github.sha }}
          files: release-files/GravityTune-v7.5.3.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
