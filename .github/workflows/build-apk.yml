name: Build Android APK Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Release GravityTune APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platforms;android-34 build-tools;34.0.0'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Android APK via Bubblewrap CLI
        run: |
          mkdir -p twa-app
          cd twa-app

          # Install Bubblewrap CLI
          npm install -g @bubblewrap/cli

          # Setup Bubblewrap config
          mkdir -p ~/.bubblewrap
          cat << EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF

          # Create keystore
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias gravitytune \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "gravitytune123" \
            -keypass "gravitytune123" \
            -dname "CN=GravityTune, OU=App, O=GravityTune, L=Jakarta, C=ID"

          # Download high-res logo
          curl -sL "https://raw.githubusercontent.com/DzuI22/Gravity-Tune/main/public/logo.png" -o icon.png

          # Initialize Bubblewrap using manifest
          bubblewrap init \
            --manifest="https://gravity-tune-three.vercel.app/manifest.json" \
            --directory=.

          # Update signing config in twa-manifest.json
          sed -i 's/"path": ".*"/"path": ".\/android.keystore"/' twa-manifest.json
          sed -i 's/"alias": ".*"/"alias": "gravitytune"/' twa-manifest.json

          # Build APK with automatic signing
          echo "gravitytune123" | bubblewrap build --skipPwaValidation

          echo "Search for APK in twa-app:"
          find . -name "*.apk"

      - name: Organize Output APK
        run: |
          mkdir -p release-files
          find twa-app -name "*.apk" -exec cp -v {} release-files/GravityTune-v2.5.0.apk \;
          
          # Check size
          ls -lh release-files/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GravityTune-Android-APK
          path: release-files/GravityTune-v2.5.0.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.5.0
          name: "GravityTune v2.5.0 (Official Android APK Release)"
          body: |
            ## 🎵 GravityTune v2.5.0 - Official Android APK
            
            Aplikasi murni Android (APK) untuk **GravityTune**!
            
            ### ✨ Fitur Unggulan di v2.5.0:
            - **Native Android APK:** Bisa langsung diinstal di HP tanpa perantara browser.
            - **Bebas Iklan & Background Play:** Streaming jutaan lagu YouTube Music lancar.
            - **Katalog Album Lengkap:** Telusuri seluruh album artis dan putar semua lagu di dalamnya.
            - **Full 17 Settings Suite:** Pengaturan kualitas audio, tema OLED, pembersih cache, dan backup JSON.
            - **Perbaikan Input Search:** Pengetikan dan penghapusan kata kunci lancar.
            
            ### 📲 Cara Pemasangan:
            1. Unduh berkas **`GravityTune-v2.5.0.apk`** di bawah ini.
            2. Buka berkas di smartphone Android Anda dan pilih **Install**.
          files: release-files/GravityTune-v2.5.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
